<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<title>BIRL! — Plataforma de Treinos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BIRL!">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<script>
  // aplica a paleta/modo escolhidos em Ajustes antes de desenhar (sem piscar) — ver src/aparencia.ts
  (function () {
    try {
      var v = JSON.parse(localStorage.getItem("birl-aparencia") || "{}");
      var p = ["brasa", "anilha", "classica"].indexOf(v.paleta) >= 0 ? v.paleta : "brasa";
      var m = v.modo || "auto";
      var claro = m === "claro" || (m === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.setAttribute("data-tema", p + "-" + (claro ? "claro" : "escuro"));
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
